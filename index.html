    <!-- No-FOUC theme: dark by default; honour a stored choice, else prefers-color-scheme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark =
            stored !== null
              ? stored === "dark"
              : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
        // Mark motion eligibility BEFORE paint so scroll-reveal elements can
        // start hidden without a flash. Only desktop + non-reduced-motion.
        // A JS safety net (motion.ts) removes this class if motion fails to load.
        try {
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var desktop = window.matchMedia("(min-width: 768px)").matches;
          if (!reduce && desktop) document.documentElement.classList.add("motion");
        } catch (e) {}
      })();
    </script>
